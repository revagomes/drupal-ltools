name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, phpcs

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax check
        run: |
          find . -path ./vendor -prune -o \
            \( -name "*.php" -o -name "*.module" -o -name "*.inc" -o -name "*.install" -o -name "*.profile" -o -name "*.theme" \) \
            -type f -print0 | \
          while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Run PHPCS
        run: |
          mapfile -d '' -t files < <(find . -path ./vendor -prune -o \
            \( -name "*.php" -o -name "*.module" -o -name "*.inc" -o -name "*.install" -o -name "*.profile" -o -name "*.theme" \) \
            -type f -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP-like Drupal files found for PHPCS."
            exit 0
          fi

          if phpcs -i | grep -Eq '(^|,[ ]?)(Drupal|DrupalPractice)(,|$)'; then
            phpcs --standard=Drupal,DrupalPractice "${files[@]}"
          else
            echo "Drupal coding standards unavailable; running PSR12 baseline."
            phpcs --standard=PSR12 --extensions=php,module,inc,install,profile,theme "${files[@]}"
          fi

      - name: Run PHPUnit
        if: hashFiles('phpunit.xml', 'phpunit.xml.dist') != ''
        run: vendor/bin/phpunit
